<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" width="800" height="328" role="img" aria-labelledby="t d">
  <title id="t">Dafallah Ibrahim, Senior Software Engineer</title>
  <desc id="d">App Store style header. Dafallah Ibrahim, Senior Software Engineer. App, backend and AI, end to end. Dubai, UAE. Open to Forward Deployed Engineer roles. Age: 8+ years shipping. Category: full-stack, mobile, web, AI. 6 self-hosted live demos. 150 of 160 pub points on pub.dev.</desc>
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#5856D6"/>
      <stop offset="1" stop-color="#AF52DE"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="6" y="10" width="152" height="152" rx="35"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif; }
    .name { font-size: 40px; font-weight: 700; fill: #F0F6FC; letter-spacing: -0.6px; }
    .role { font-size: 22px; font-weight: 500; fill: #9198A1; }
    .line { font-size: 19px; fill: #9198A1; }
    .tagtx { font-size: 18px; font-weight: 600; fill: #58A6FF; }
    .lab { font-size: 18px; font-weight: 600; letter-spacing: 1.2px; fill: #9198A1; text-anchor: middle; }
    .val { font-size: 28px; font-weight: 700; fill: #F0F6FC; text-anchor: middle; letter-spacing: -0.3px; }
    .sub { font-size: 18px; fill: #9198A1; text-anchor: middle; }
    .rule { stroke: #30363D; stroke-width: 1; }
    .mono { font-size: 70px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: -2px; }

    .icon { animation: pop .7s cubic-bezier(.2,.9,.3,1.2) both; transform-box: fill-box; transform-origin: center; }
    .rise { animation: rise .6s ease-out both; }
    .col { animation: rise .6s ease-out both; }
    .shine { animation: shine 1.4s .5s ease-in-out both; }
    .pulse { animation: pulse 2.4s 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shine { from { transform: translateX(0); } to { transform: translateX(380px); } }
    @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
    @media (prefers-reduced-motion: reduce) {
      .icon, .rise, .col, .pulse { animation: none; }
      .shine { animation: none; display: none; }
    }
  </style>

  <!-- app icon -->
  <g class="icon">
    <g filter="url(#sh)"><rect x="6" y="10" width="152" height="152" rx="35" fill="url(#ig)"/></g>
    <g clip-path="url(#sq)">
      <rect x="6" y="10" width="152" height="152" fill="url(#gloss)"/>
      <g transform="skewX(-18)"><rect class="shine" x="-120" y="0" width="60" height="180" fill="url(#sheen)"/></g>
    </g>
    <rect x="6.5" y="10.5" width="151" height="151" rx="34.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="82" y="111" class="mono">DI</text>
    <rect x="70" y="124" width="24" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>

  <!-- title block -->
  <g class="rise" style="animation-delay:.12s"><text x="190" y="54" class="name">Dafallah Ibrahim</text></g>
  <g class="rise" style="animation-delay:.2s"><text x="191" y="88" class="role">Senior Software Engineer</text></g>
  <g class="rise" style="animation-delay:.28s"><text x="191" y="117" class="line">App, backend and AI, end to end · Dubai, UAE</text></g>
  <g class="rise" style="animation-delay:.36s">
    <rect x="190" y="133" width="422" height="34" rx="17" fill="#0D233C" fill-opacity="1"/>
    <circle cx="208" cy="150" r="4.5" fill="#3FB950"/>
    <circle class="pulse" cx="208" cy="150" r="4.5" fill="#3FB950"/>
    <text x="223" y="156.4" class="tagtx" textLength="368" lengthAdjust="spacing">Open to Forward Deployed Engineer roles</text>
  </g>

  <!-- info strip -->
  <line x1="0" y1="196.5" x2="800" y2="196.5" class="rule"/>

    <g class="col" style="animation-delay:0.55s">
      <text x="100" y="231" class="lab">AGE</text>
      <text x="100" y="267" class="val">8+</text>
      <text x="100" y="295" class="sub">Years shipping</text>
    </g>
    <g class="col" style="animation-delay:0.64s">
      <text x="300" y="231" class="lab">CATEGORY</text>
      <text x="300" y="267" class="val">Full-stack</text>
      <text x="300" y="295" class="sub">Mobile, web, AI</text>
    </g>
    <line x1="200.5" y1="214" x2="200.5" y2="296" class="rule"/>
    <g class="col" style="animation-delay:0.73s">
      <text x="500" y="231" class="lab">LIVE DEMOS</text>
      <text x="500" y="267" class="val">6</text>
      <text x="500" y="295" class="sub">Self-hosted</text>
    </g>
    <line x1="400.5" y1="214" x2="400.5" y2="296" class="rule"/>
    <g class="col" style="animation-delay:0.82s">
      <text x="700" y="231" class="lab">PUB POINTS</text>
      <text x="700" y="267" class="val">150</text>
      <text x="700" y="295" class="sub">of 160, pub.dev</text>
    </g>
    <line x1="600.5" y1="214" x2="600.5" y2="296" class="rule"/>
</svg>
